name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-data-manager-api-client:
    name: Build Data Manager API client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Data Manager OpenAPI spec
        run: curl --fail --location --show-error --silent https://squonk.it/data-manager-api/openapi.json --output openapi.yaml

      - name: Generate client
        run: pnpm orval

      - name: Build package
        run: pnpm build
